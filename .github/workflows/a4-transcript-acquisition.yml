name: A4 transcript acquisition

on:
  push:
    branches:
      - a4-suspension-steering

permissions:
  contents: read

jobs:
  fetch-transcripts:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch queued A4 video transcripts
        shell: bash
        run: |
          set -u
          mkdir -p transcripts
          ids=(
            eHG1gDpVpoE
            brgWEHip1_c
            uSyLmYMX2D0
            qoQwvJnk4Z0
            UjvpfP8wE_s
            bFOy-_jgfnI
            8Y-Z63vXg7w
            ZGjzZG5uOkE
            7OByzAQw2yo
            eUnPiN6aico
            gc2blDwAJBk
            yMPR8-MKKEw
            NZUgNJjUQLY
            oAxqgnd26nI
          )
          : > transcripts/status.txt
          for id in "${ids[@]}"; do
            url="https://youtube-transcript.ai/transcript/${id}.txt"
            if curl --location --fail --silent --show-error "$url" -o "transcripts/${id}.md"; then
              printf '%s\tok\n' "$id" >> transcripts/status.txt
            else
              printf '%s\tfailed\n' "$id" >> transcripts/status.txt
              rm -f "transcripts/${id}.md"
            fi
          done
          cat transcripts/status.txt
      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: a4-video-transcripts
          path: transcripts/
          if-no-files-found: error
          retention-days: 1
