name: Materialize A1 source acquisition artifact

on:
  push:
    branches: [atomic-video-sources-a1-brakes]
    paths: [.github/workflows/materialize-a1-source-artifact.yml]

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atomic-video-sources-a1-brakes
      - uses: actions/download-artifact@v4
        with:
          name: a1-video-source-acquisition
          path: _work/a1-video-source-acquisition
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: the-twin-pines/ASE
          run-id: 34038601190
      - name: Record artifact contents
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _work/a1-video-source-acquisition
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize A1 source acquisition artifact"
          git push origin HEAD:atomic-video-sources-a1-brakes
