name: ASE source integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout pinned checked Ithon runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 396d8b7af1417a0a61245db940fdb22ef9fbac51
          path: _ithon
          persist-credentials: false
      - name: Verify source receipts and targeted bad cases
        env:
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ase-ithon-checks.jsonl
        shell: _ithon/ithon examples/autogenerated/source-authority/ci.pi {0}
        run: verify
