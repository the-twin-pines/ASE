name: ASE deterministic circuit checker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  circuit-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout the existing ASE checked Ithon pin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 396d8b7af1417a0a61245db940fdb22ef9fbac51
          path: _ithon
          persist-credentials: false
      - name: Check circuit semantics, independent oracle and bad controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ase-circuit-ithon-checks.jsonl
        shell: /bin/sh _ithon/ithon examples/autogenerated/circuit-checker/ci.pi {0}
        run: verify
