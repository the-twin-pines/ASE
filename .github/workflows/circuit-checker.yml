name: ASE deterministic circuit checker
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  circuit-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned Ithon with typed containers and structured control flow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: _ithon
          persist-credentials: false
      - name: Check semantics, independent oracle and known-bad controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ITHON_CHECK_RECEIPT: ${{ runner.temp }}/ase-circuit-ithon-checks.jsonl
        shell: /bin/sh _ithon/ithon examples/autogenerated/circuit-checker/ci.pi {0}
        run: verify
